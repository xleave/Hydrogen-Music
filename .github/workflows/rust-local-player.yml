name: Hydrogen Music CI

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrogen-music-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - run: npm ci --no-fund
      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend smoke tests
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.21.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  fedora-rpm:
    name: Fedora 42 RPM
    needs: verify
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Fedora build dependencies
        run: >-
          dnf install -y
          nodejs npm
          gcc gcc-c++ make
          webkit2gtk4.1-devel openssl-devel
          curl wget file
          alsa-lib-devel
          libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          rpm-build patchelf
      - run: npm ci --no-fund
      - name: Build Fedora RPM
        run: npm run tauri -- build --bundles rpm
      - uses: actions/upload-artifact@v6
        with:
          name: hydrogen-music-fedora-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows-installer:
    name: Windows NSIS
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: npm ci --no-fund
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: hydrogen-music-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - fedora-rpm
      - windows-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: hydrogen-music-*
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
