name: Rust local player

on:
  push:
    branches: ["agent/rust-local-player"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Frontend and Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - run: npm ci --no-fund
      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  fedora-rpm:
    name: Fedora 42 RPM
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fedora build dependencies
        run: >-
          dnf install -y
          nodejs npm
          gcc gcc-c++ make
          webkit2gtk4.1-devel openssl-devel
          curl wget file
          alsa-lib-devel
          libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          rpm-build patchelf
      - run: npm ci --no-fund
      - run: npm run tauri -- build --bundles rpm
      - uses: actions/upload-artifact@v6
        with:
          name: hydrogen-music-fedora-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
