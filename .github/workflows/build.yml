name: Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

jobs:
  fedora-rpm:
    name: Fedora 42 RPM release
    runs-on: ubuntu-24.04
    container: fedora:42
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Fedora build dependencies
        run: >-
          dnf install -y
          nodejs npm
          gcc gcc-c++ make
          webkit2gtk4.1-devel openssl-devel
          curl wget file
          alsa-lib-devel
          libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          rpm-build patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-fund
      - name: Build Fedora RPM
        run: npm run tauri -- build --bundles rpm
      - uses: actions/upload-artifact@v6
        with:
          name: hydrogen-music-fedora-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
