name: Finalize core hardening

on:
  push:
    branches: ["agent/rust-local-player"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Apply guarded final core patch and self-clean
        run: |
          sleep 15
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/rust-local-player
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text()

          old_sig = '''async fn scan_local_music(\n    settings: State<'_, SettingsState>,\n    scan: State<'_, ScanState>,\n    request_id: u64,\n) -> Result<library::ScanResult, String> {'''
          new_sig = '''async fn scan_local_music(\n    settings: State<'_, SettingsState>,\n    scan: State<'_, ScanState>,\n) -> Result<library::ScanResult, String> {'''
          if new_sig not in text and old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          old_gen = '''    let latest = scan.0.clone();\n    let previous = latest.fetch_max(request_id, Ordering::AcqRel);\n    if previous > request_id {\n        return Err(library::STALE_SCAN.to_string());\n    }\n    tauri::async_runtime::spawn_blocking(move || {'''
          new_gen = '''    let latest = scan.0.clone();\n    // Native ownership prevents a WebView reload from resetting the generation\n    // below the long-lived Rust process state.\n    let request_id = latest.fetch_add(1, Ordering::AcqRel) + 1;\n    tauri::async_runtime::spawn_blocking(move || {'''
          if new_gen not in text and old_gen in text:
              text = text.replace(old_gen, new_gen, 1)

          request_pattern = re.compile(
              r'pub\(crate\) fn request_exit\(app: &AppHandle\) \{.*?\n\}\n\n#\[tauri::command\]\nasync fn quit_app\(.*?\n\}\n',
              re.S,
          )
          replacement = r'''fn persist_native_snapshot_bounded(
    app: AppHandle,
    writer: Arc<Mutex<()>>,
    snapshot: PlaybackSnapshotState,
    audio: audio::AudioState,
    timeout: Duration,
) -> Result<(), String> {
    let (sender, receiver) = std::sync::mpsc::sync_channel(1);
    std::thread::spawn(move || {
        let result = persist_native_snapshot_blocking(&app, &writer, &snapshot, &audio);
        let _ = sender.send(result);
    });
    match receiver.recv_timeout(timeout) {
        Ok(result) => result,
        Err(std::sync::mpsc::RecvTimeoutError::Timeout) => {
            Err("native persistence timed out during exit".to_string())
        }
        Err(std::sync::mpsc::RecvTimeoutError::Disconnected) => {
            Err("native persistence worker disconnected during exit".to_string())
        }
    }
}

pub(crate) fn request_exit(app: &AppHandle) {
    let exit_state = app.state::<ExitState>();
    if exit_state.0.swap(true, Ordering::AcqRel) {
        return;
    }

    if let Some(window) = app.get_webview_window("main") {
        let _ = window.emit("app-exit-requested", ());
    }

    // Give a healthy renderer time to flush settings and playback state. The
    // native fallback then performs a bounded final checkpoint; even a stuck
    // fsync/NFS writer cannot keep the process alive forever.
    let app_handle = app.clone();
    let writer = app.state::<PersistenceState>().0.clone();
    let snapshot = app.state::<PlaybackSnapshotState>().inner().clone();
    let audio = app.state::<audio::AudioState>().inner().clone();
    std::thread::spawn(move || {
        std::thread::sleep(EXIT_FALLBACK_DELAY);
        if let Err(error) = persist_native_snapshot_bounded(
            app_handle.clone(),
            writer,
            snapshot,
            audio,
            Duration::from_millis(500),
        ) {
            eprintln!("[exit] {error}");
        }
        app_handle.exit(0);
    });
}

#[tauri::command]
async fn quit_app(
    app: AppHandle,
    exit: State<'_, ExitState>,
    persistence: State<'_, PersistenceState>,
    snapshot: State<'_, PlaybackSnapshotState>,
    audio: State<'_, audio::AudioState>,
) -> Result<(), String> {
    exit.0.store(true, Ordering::Release);
    let app_handle = app.clone();
    let writer = persistence.0.clone();
    let snapshot = snapshot.inner().clone();
    let audio = audio.inner().clone();
    let result = tauri::async_runtime::spawn_blocking(move || {
        persist_native_snapshot_bounded(
            app_handle,
            writer,
            snapshot,
            audio,
            Duration::from_millis(1200),
        )
    })
    .await
    .map_err(|error| error.to_string())?;
    if let Err(error) = result {
        eprintln!("[exit] {error}");
    }
    app.exit(0);
    Ok(())
}
'''
          if 'fn persist_native_snapshot_bounded(' not in text:
              text, count = request_pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('exit hardening anchor changed')
          path.write_text(text)

          api = Path('src/platform/windowApi.js')
          api_text = api.read_text()
          old_call = "const result = await invoke('scan_local_music', { requestId })"
          new_call = "const result = await invoke('scan_local_music')"
          if new_call not in api_text:
              if old_call not in api_text:
                  raise SystemExit('scan invoke is neither old nor expected new form')
              api_text = api_text.replace(old_call, new_call, 1)
          api.write_text(api_text)
          PY
          rm -f .github/workflows/apply-native-scan-generation.yml
          rm -f .github/workflows/finalize-native-scan-generation.yml
          rm -f .github/workflows/finalize-core-hardening.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: bound native persistence during forced exit"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              sleep 3
              git pull --rebase origin agent/rust-local-player
            done
            exit 1
          fi
