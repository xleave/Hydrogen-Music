name: Apply MPRIS artwork migration

on:
  push:
    branches: [agent/rust-local-player]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply MPRIS artwork migration' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-local-player
      - name: Apply focused artwork migration
        shell: python
        run: |
          from pathlib import Path

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text()

          marker = '''#[tauri::command]\nasync fn read_cover(\n    settings: State<'_, SettingsState>,\n    file_path: String,\n) -> Result<Option<String>, String> {\n    let folders = configured_music_folders(&settings)?;\n    tauri::async_runtime::spawn_blocking(move || read_cover_blocking(folders, file_path))\n        .await\n        .map_err(|error| error.to_string())?\n}\n'''
          helper = marker + '''\nfn materialize_media_cover_blocking(\n    app: AppHandle,\n    folders: Vec<PathBuf>,\n    file_path: String,\n) -> Result<Option<String>, String> {\n    let file_path = authorized_file_path_from_folders(&folders, &file_path)?;\n    let Ok(tagged) = read_from_path(&file_path) else {\n        return Ok(None);\n    };\n    let picture = tagged.tags().iter().find_map(|tag| tag.pictures().first());\n    let Some(picture) = picture else {\n        return Ok(None);\n    };\n    if picture.data().len() > MAX_COVER_BYTES {\n        return Err("embedded cover is too large".to_string());\n    }\n    validate_cover_dimensions(picture.data())?;\n\n    let extension = match cover_mime(picture.data()) {\n        "image/png" => "png",\n        "image/jpeg" => "jpg",\n        "image/gif" => "gif",\n        "image/bmp" => "bmp",\n        "image/tiff" => "tiff",\n        _ => return Ok(None),\n    };\n\n    let metadata = std::fs::metadata(&file_path).map_err(|error| error.to_string())?;\n    let mut hasher = std::collections::hash_map::DefaultHasher::new();\n    std::hash::Hash::hash(&file_path, &mut hasher);\n    std::hash::Hash::hash(&metadata.len(), &mut hasher);\n    if let Ok(modified) = metadata.modified() {\n        if let Ok(stamp) = modified.duration_since(std::time::UNIX_EPOCH) {\n            std::hash::Hash::hash(&stamp.as_nanos(), &mut hasher);\n        }\n    }\n    let key = std::hash::Hasher::finish(&hasher);\n\n    let directory = app\n        .path()\n        .app_cache_dir()\n        .map_err(|error| error.to_string())?\n        .join("mpris-artwork");\n    std::fs::create_dir_all(&directory).map_err(|error| error.to_string())?;\n    let target = directory.join(format!("{key:016x}.{extension}"));\n    let needs_write = std::fs::metadata(&target)\n        .map(|cached| cached.len() != picture.data().len() as u64)\n        .unwrap_or(true);\n    if needs_write {\n        std::fs::write(&target, picture.data()).map_err(|error| error.to_string())?;\n    }\n\n    let mut cached = std::fs::read_dir(&directory)\n        .map_err(|error| error.to_string())?\n        .filter_map(Result::ok)\n        .filter_map(|entry| {\n            let path = entry.path();\n            if path == target || !path.is_file() {\n                return None;\n            }\n            let modified = entry.metadata().ok()?.modified().ok()?;\n            Some((modified, path))\n        })\n        .collect::<Vec<_>>();\n    cached.sort_by_key(|(modified, _)| *modified);\n    let remove_count = cached.len().saturating_sub(31);\n    for (_, path) in cached.into_iter().take(remove_count) {\n        let _ = std::fs::remove_file(path);\n    }\n\n    let url = tauri::Url::from_file_path(&target)\n        .map_err(|_| "failed to create MPRIS artwork file URL".to_string())?;\n    Ok(Some(url.to_string()))\n}\n'''
          if marker not in text:
              raise SystemExit('read_cover marker not found')
          text = text.replace(marker, helper, 1)

          old = '''#[tauri::command]\nfn media_set_metadata(\n    media: State<'_, media::MediaState>,\n    title: String,\n    artist: String,\n    album: String,\n    duration: f64,\n) -> Result<(), String> {\n    let duration = finite(duration, "duration")?.clamp(0.0, MAX_AUDIO_SECONDS);\n    media.set_metadata(\n        &bounded_text(&title, MAX_TEXT_CHARS),\n        &bounded_text(&artist, MAX_TEXT_CHARS),\n        &bounded_text(&album, MAX_TEXT_CHARS),\n        duration,\n    )\n}\n'''
          new = '''#[tauri::command]\nasync fn media_set_metadata(\n    app: AppHandle,\n    settings: State<'_, SettingsState>,\n    media: State<'_, media::MediaState>,\n    title: String,\n    artist: String,\n    album: String,\n    duration: f64,\n    file_path: Option<String>,\n) -> Result<(), String> {\n    let duration = finite(duration, "duration")?.clamp(0.0, MAX_AUDIO_SECONDS);\n    let title = bounded_text(&title, MAX_TEXT_CHARS);\n    let artist = bounded_text(&artist, MAX_TEXT_CHARS);\n    let album = bounded_text(&album, MAX_TEXT_CHARS);\n    let cover_url = if let Some(file_path) = file_path {\n        let folders = configured_music_folders(&settings)?;\n        tauri::async_runtime::spawn_blocking(move || {\n            materialize_media_cover_blocking(app, folders, file_path)\n        })\n        .await\n        .map_err(|error| error.to_string())??\n    } else {\n        None\n    };\n    media.set_metadata(\n        &title,\n        &artist,\n        &album,\n        duration,\n        cover_url.as_deref(),\n    )\n}\n'''
          if old not in text:
              raise SystemExit('media_set_metadata marker not found')
          lib.write_text(text.replace(old, new, 1))

          playback = Path('src/utils/player/playback.js')
          text = playback.read_text()
          old = "windowApi.setSystemMediaMetadata({ ...metadata, duration: time.value }).catch((error) => reportAudioError('media.metadata', error))"
          new = "windowApi.setSystemMediaMetadata({ ...metadata, duration: time.value, filePath: track.url }).catch((error) => reportAudioError('media.metadata', error))"
          if old not in text:
              raise SystemExit('playback metadata marker not found')
          playback.write_text(text.replace(old, new, 1))
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/mpris-artwork-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src/utils/player/playback.js .github/workflows/mpris-artwork-migration.yml
          git commit -m "fix: expose local cover art to MPRIS"
          git push origin HEAD:agent/rust-local-player
