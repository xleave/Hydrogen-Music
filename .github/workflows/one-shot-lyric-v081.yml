name: One-shot lyric progress migration

on:
  push:
    branches:
      - agent/rust-local-player
    paths:
      - .github/workflows/one-shot-lyric-v081.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-local-player
          fetch-depth: 1

      - name: Apply lyric progress migration and version bump
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          lyric_path = Path('src/components/Lyric.vue')
          lyric = lyric_path.read_text()
          lyric = replace_once(
              lyric,
              "  currentIndex,\n  currentMusic,\n  lyric,",
              "  currentIndex,\n  lyric,",
              'remove currentMusic ref',
          )
          lyric = replace_once(
              lyric,
              "  lyricsObjArr,\n  playing,\n  playerChangeSong,",
              "  lyricsObjArr,\n  playerChangeSong,\n  progress,",
              'use progress ref',
          )
          lyric = replace_once(lyric, "let activeTimer = null\n", "", 'remove active timer state')
          lyric = replace_once(
              lyric,
              "function updateActiveLine() {\n  const seek = currentMusic.value?.seek()\n  if (typeof seek !== 'number') return\n",
              "function updateActiveLine(seek) {\n  if (!Number.isFinite(seek)) return\n",
              'consume shared progress',
          )
          lyric = replace_once(
              lyric,
              "function startActiveTimer() {\n  clearInterval(activeTimer)\n  activeTimer = setInterval(updateActiveLine, 200)\n  updateActiveLine()\n}\n\n",
              "",
              'remove duplicate lyric timer',
          )
          lyric = replace_once(
              lyric,
              "watch(\n  () => [widgetState.value, playing.value, lyricShow.value, lyricsObjArr.value],\n  () => {\n    if (!widgetState.value && playing.value && lyricShow.value && lyricsObjArr.value) startActiveTimer()\n    else clearInterval(activeTimer)\n  },\n)\n",
              "watch(\n  () => [progress.value, widgetState.value, lyricShow.value, lyricsObjArr.value],\n  ([seek, isWidget, showLyric, lines]) => {\n    if (!isWidget && showLyric && lines) updateActiveLine(Number(seek))\n  },\n  { immediate: true },\n)\n",
              'replace lyric timer watch',
          )
          lyric = replace_once(lyric, "  clearInterval(activeTimer)\n", "", 'remove timer cleanup')
          if 'setInterval(updateActiveLine' in lyric or 'activeTimer' in lyric:
              raise SystemExit('lyric timer references remain')
          lyric_path.write_text(lyric)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          if package.get('version') != '0.8.0':
              raise SystemExit(f"package.json version changed unexpectedly: {package.get('version')}")
          package['version'] = '0.8.1'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          if lock.get('version') != '0.8.0' or lock.get('packages', {}).get('', {}).get('version') != '0.8.0':
              raise SystemExit('package-lock root version changed unexpectedly')
          lock['version'] = '0.8.1'
          lock['packages']['']['version'] = '0.8.1'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')

          cargo_path = Path('src-tauri/Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = replace_once(cargo, 'version = "0.8.0"', 'version = "0.8.1"', 'Cargo.toml version')
          cargo_path.write_text(cargo)

          cargo_lock_path = Path('src-tauri/Cargo.lock')
          cargo_lock = cargo_lock_path.read_text()
          cargo_lock, count = re.subn(
              r'(\[\[package\]\]\nname = "hydrogen-music"\nversion = ")0\.8\.0(")',
              r'\g<1>0.8.1\g<2>',
              cargo_lock,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Cargo.lock hydrogen-music version: expected one match, got {count}')
          cargo_lock_path.write_text(cargo_lock)

          tauri_path = Path('src-tauri/tauri.conf.json')
          tauri = json.loads(tauri_path.read_text())
          if tauri.get('version') != '0.8.0':
              raise SystemExit(f"tauri.conf version changed unexpectedly: {tauri.get('version')}")
          tauri['version'] = '0.8.1'
          tauri_path.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + '\n')

          settings_path = Path('src/views/Settings.vue')
          settings = settings_path.read_text()
          settings = replace_once(
              settings,
              '<div class="version">V0.8.0</div>',
              '<div class="version">V0.8.1</div>',
              'Settings version label',
          )
          settings_path.write_text(settings)

          workflow = Path('.github/workflows/one-shot-lyric-v081.yml')
          workflow.unlink()
          PY

      - name: Verify migration
        shell: bash
        run: |
          git diff --check
          grep -q 'version": "0.8.1"' package.json
          grep -q 'version = "0.8.1"' src-tauri/Cargo.toml
          grep -q '"version": "0.8.1"' src-tauri/tauri.conf.json
          grep -q 'V0.8.1' src/views/Settings.vue
          ! grep -q 'activeTimer\|setInterval(updateActiveLine' src/components/Lyric.vue

      - name: Commit migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: share playback progress with lyrics and bump 0.8.1"
          git push origin HEAD:agent/rust-local-player
