name: Apply library warm-cache integration

on:
  push:
    branches: ["agent/rust-local-player"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Apply guarded lib.rs integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text()

          module_old = 'mod audio;\nmod library;\nmod media;\nmod storage;'
          module_new = 'mod audio;\nmod library;\nmod library_snapshot;\nmod media;\nmod storage;'
          if module_new not in text:
              if module_old not in text:
                  raise SystemExit('module insertion anchor changed')
              text = text.replace(module_old, module_new, 1)

          scan_old = '''#[tauri::command]
          async fn scan_local_music(
              settings: State<'_, SettingsState>,
              scan: State<'_, ScanState>,
              request_id: u64,
          ) -> Result<library::ScanResult, String> {
              let folders = configured_music_folders(&settings)?;
              let latest = scan.0.clone();
              let previous = latest.fetch_max(request_id, Ordering::AcqRel);
              if previous > request_id {
                  return Err(library::STALE_SCAN.to_string());
              }
              tauri::async_runtime::spawn_blocking(move || library::scan(&folders, request_id, &latest))
                  .await
                  .map_err(|error| error.to_string())?
          }
          '''
          scan_new = '''#[tauri::command]
          async fn get_cached_library(
              settings: State<'_, SettingsState>,
          ) -> Result<Option<Value>, String> {
              let stored = settings
                  .0
                  .read()
                  .map_err(|error| error.to_string())
                  .map(|value| stored_music_folders_from_value(&value))?;
              let folders = configured_music_folders(&settings)?;
              if folders.len() != stored.len() {
                  return Ok(None);
              }
              tauri::async_runtime::spawn_blocking(move || library_snapshot::load(&folders))
                  .await
                  .map_err(|error| error.to_string())?
          }

          #[tauri::command]
          async fn scan_local_music(
              settings: State<'_, SettingsState>,
              scan: State<'_, ScanState>,
              request_id: u64,
          ) -> Result<library::ScanResult, String> {
              let stored = settings
                  .0
                  .read()
                  .map_err(|error| error.to_string())
                  .map(|value| stored_music_folders_from_value(&value))?;
              let folders = configured_music_folders(&settings)?;
              let may_snapshot = folders.len() == stored.len();
              let latest = scan.0.clone();
              let previous = latest.fetch_max(request_id, Ordering::AcqRel);
              if previous > request_id {
                  return Err(library::STALE_SCAN.to_string());
              }
              tauri::async_runtime::spawn_blocking(move || {
                  let result = library::scan(&folders, request_id, &latest)?;
                  if may_snapshot {
                      if let Err(error) = library_snapshot::save(&folders, &result) {
                          eprintln!("[library snapshot] failed to persist cache: {error}");
                      }
                  }
                  Ok(result)
              })
              .await
              .map_err(|error| error.to_string())?
          }
          '''
          if 'async fn get_cached_library(' not in text:
              if scan_old not in text:
                  raise SystemExit('scan integration anchor changed')
              text = text.replace(scan_old, scan_new, 1)

          handler_old = '            select_local_folder,\n            scan_local_music,'
          handler_new = '            select_local_folder,\n            get_cached_library,\n            scan_local_music,'
          if handler_new not in text:
              if handler_old not in text:
                  raise SystemExit('invoke handler anchor changed')
              text = text.replace(handler_old, handler_new, 1)

          path.write_text(text)
          PY
      - name: Commit integration if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "perf: warm-start library from cached snapshot"
            git push
          fi
