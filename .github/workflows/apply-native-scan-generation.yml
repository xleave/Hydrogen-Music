name: Apply native scan generation

on:
  push:
    branches: ["agent/rust-local-player"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Apply guarded generation patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text()
          old = '''async fn scan_local_music(\n    settings: State<'_, SettingsState>,\n    scan: State<'_, ScanState>,\n    request_id: u64,\n) -> Result<library::ScanResult, String> {'''
          new = '''async fn scan_local_music(\n    settings: State<'_, SettingsState>,\n    scan: State<'_, ScanState>,\n) -> Result<library::ScanResult, String> {'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scan command signature anchor changed')
              text = text.replace(old, new, 1)

          old = '''    let latest = scan.0.clone();\n    let previous = latest.fetch_max(request_id, Ordering::AcqRel);\n    if previous > request_id {\n        return Err(library::STALE_SCAN.to_string());\n    }\n    tauri::async_runtime::spawn_blocking(move || {'''
          new = '''    let latest = scan.0.clone();\n    // Native ownership prevents a WebView reload from resetting the generation\n    // below the long-lived Rust process state.\n    let request_id = latest.fetch_add(1, Ordering::AcqRel) + 1;\n    tauri::async_runtime::spawn_blocking(move || {'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scan generation anchor changed')
              text = text.replace(old, new, 1)
          lib.write_text(text)

          api = Path('src/platform/windowApi.js')
          text = api.read_text()
          old = "const result = await invoke('scan_local_music', { requestId })"
          new = "const result = await invoke('scan_local_music')"
          if new not in text:
              if old not in text:
                  raise SystemExit('windowApi scan invocation anchor changed')
              text = text.replace(old, new, 1)
          api.write_text(text)
          PY
      - name: Commit fix if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src/platform/windowApi.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: keep music scan generations native"
            git push
          fi
