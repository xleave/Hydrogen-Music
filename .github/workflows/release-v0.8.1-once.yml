name: Publish v0.8.1 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.8.1-once.yml"

permissions:
  contents: write

env:
  RELEASE_TAG: v0.8.1
  RELEASE_SHA: ea1dfb1b28a9faa2699739f6b2ba2b419da8c396

jobs:
  fedora-rpm:
    name: Fedora 42 RPM
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fedora build dependencies
        run: >-
          dnf install -y
          nodejs npm
          gcc gcc-c++ make
          webkit2gtk4.1-devel openssl-devel
          curl wget file
          alsa-lib-devel
          libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          rpm-build patchelf
      - run: npm ci --no-fund
      - name: Build Fedora RPM
        run: npm run tauri -- build --bundles rpm
      - uses: actions/upload-artifact@v6
        with:
          name: hydrogen-music-fedora-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows-installer:
    name: Windows NSIS
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-fund
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: hydrogen-music-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish v0.8.1
    needs:
      - fedora-rpm
      - windows-installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: hydrogen-music-*
          path: release-artifacts
          merge-multiple: true
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${RELEASE_SHA}" >/dev/null
          if ! gh release create "${RELEASE_TAG}" release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Hydrogen Music ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" || true
            exit 1
          fi

  cleanup:
    name: Remove one-shot workflow
    needs: publish-release
    if: ${{ needs.publish-release.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Delete one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git rm .github/workflows/release-v0.8.1-once.yml
          git commit -m "chore: remove one-shot v0.8.1 release workflow [skip ci]"
          git push origin HEAD:main
